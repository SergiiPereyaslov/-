# nginx перед застосунком: HTTPS, стиснення, кешування статики, обмеження частоти.
# Покласти в /etc/nginx/sites-available/smartecopack і зробити symlink
# у sites-enabled. Сертифікат — certbot --nginx -d smartecopack.com -d www.smartecopack.com

# Версію nginx стороннім знати нема потреби
server_tokens off;

# ── Обмеження частоти запитів ────────────────────────────────────────────
#
# Зони оголошені в контексті http (цей файл підключається саме туди).
# 10m пам'яті ≈ 160 тис. IP — з запасом.
#
# Вхід в адмінку: застосунок і сам блокує акаунт після 10 невдалих спроб,
# але це другий рубіж — він зупиняє перебір ще до bcrypt, не даючи
# навантажити процесор. 60 запитів/хв вистачає для звичайної роботи в
# панелі, де кожна сторінка — кілька запитів.
limit_req_zone $binary_remote_addr zone=sep_admin:10m rate=60r/m;

# Заявки: справжня людина надсилає форму раз на кілька хвилин.
limit_req_zone $binary_remote_addr zone=sep_lead:10m rate=10r/m;

# Пошук і лічильник A/B: пошук ходить на кожне натискання з дебаунсом 200 мс,
# тому ліміт має бути помітно вищим, інакше постраждає підказка в пошуку.
limit_req_zone $binary_remote_addr zone=sep_api:10m rate=120r/m;

# 429 замість 503: чесний код для «забагато запитів»
limit_req_status 429;

# Увесь трафік на канонічний хост по HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartecopack.com www.smartecopack.com;
    return 301 https://smartecopack.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smartecopack.com;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com/privkey.pem;

    # www — окремий хост, а не дубль: без цього редиректу пошуковик
    # бачив би дві копії сайту
    return 301 https://smartecopack.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartecopack.com;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Розмір завантаження в адмінці: імпорт каталогу обмежений 5 МБ
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml image/svg+xml;

    # Хешовані ресурси Next — незмінні, кешуємо назавжди
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Приймання заявок — найдорожчий публічний ендпоінт: пише в БД і смикає
    # Telegram та SMTP. Без ліміту ним можна засипати менеджера й підставити
    # поштовий домен під блоклист.
    location = /api/lead/ {
        limit_req zone=sep_lead burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Решта публічного API: пошук і лічильник тесту
    location /api/ {
        limit_req zone=sep_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Адмінка не має кешуватись і не має потрапляти до пошукових систем
    location /admin/ {
        limit_req zone=sep_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
