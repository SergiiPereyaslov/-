# nginx перед застосунком: HTTPS, стиснення, кешування статики.
# Покласти в /etc/nginx/sites-available/smartecopack і зробити symlink
# у sites-enabled. Сертифікат — certbot --nginx -d smartecopack.com -d www.smartecopack.com

# Увесь трафік на канонічний хост по HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartecopack.com www.smartecopack.com;
    return 301 https://smartecopack.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smartecopack.com;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com/privkey.pem;

    # www — окремий хост, а не дубль: без цього редиректу пошуковик
    # бачив би дві копії сайту
    return 301 https://smartecopack.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartecopack.com;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Розмір завантаження в адмінці: імпорт каталогу обмежений 5 МБ
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml image/svg+xml;

    # Хешовані ресурси Next — незмінні, кешуємо назавжди
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Адмінка не має кешуватись і не має потрапляти до пошукових систем
    location /admin/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
