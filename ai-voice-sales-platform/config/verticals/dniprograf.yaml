# Vertical: Дніпрограф
# Conforms to config/schema.json
#
# Дніпрограф is a printing house (оперативна поліграфія). Target audience is
# B2B — any enterprise that uses printed materials. `[CLIENT]`
#
# Provenance labels: `[CLIENT]` answered directly · `[WEB]` public sources,
# see notes · `DRAFT` proposed by the agent, awaiting client approval ·
# TODO(BLOCKER) genuinely unknown, must not be guessed.
#
# Seed data in this repository belongs to a separate project for a different
# company and is NOT a source for this file.

vertical: dniprograf
status: discovery-incomplete

language:
  primary: uk-UA
  fallback: []
  voice_id: null                      # TODO(RESEARCH) — after TTS selection in P2

business:
  legal_name: "ТОВ «Дніпрограф»"
  short_name: "Дніпрограф"
  edrpou: null                        # TODO(BLOCKER) — confirm with client
  city: "м. Дніпро"                   # [WEB] пр. Олександра Поля, 82-Г
  what_we_sell: "оперативна поліграфія — друк рекламної продукції, етикеток, бланків та широкоформату"

  # [CLIENT] — direct answer
  products:
    - "рекламна поліграфія (буклети, каталоги, листівки, візитівки)"
    - "етикетки та наліпки"
    - "бланки та офісна поліграфія"
    - "широкоформатний друк, POS-матеріали"

  # [CLIENT] — explicitly NOT offered. These are disqualifiers, not gaps.
  does_not_offer:
    - "пакування (коробки, тара)"
    - "друк на тканині"

  # [WEB] supporting services — useful as qualification hooks
  services:
    - "дизайн / підготовка макета"
    - "ламінування"
    - "експрес-друк"

  delivery: "Нова пошта по всій Україні"   # [WEB] — supports nationwide calling

  avg_deal_uah: null                  # TODO(BLOCKER)
  min_order_uah: null                 # TODO(BLOCKER) — becomes a disqualifier once known
  seasonality: []                     # TODO(BLOCKER)

lead_source:
  adapter: youcontrol-export
  filters:
    kved: []                          # TODO(BLOCKER)
    region: ["Україна"]               # [CLIENT] — nationwide; delivery does not constrain
  expected_list_size: null            # TODO(BLOCKER)
  notes: "Відкритий B2B-ринок. Вичерпання бази при 100 дзвінках/день не загрожує."

call_goal:
  primary: "отримати ТЗ на прорахунок — що друкувати, тираж, терміни, чи є макет"   # [CLIENT]
  fallback: "зʼясувати, хто відповідає за замовлення поліграфії, та як з ним звʼязатися"
  # DRAFT — переводимо, коли є що прораховувати або коли просять людину.
  handoff_condition: "отримано щонайменше продукт + тираж, АБО клієнт прямо просить менеджера чи ціну"

decision_maker:
  roles:                              # [CLIENT]
    - "закупівлі / постачання"
    - "власник / директор"
  not_decision_maker:
    - "приймальня"
    - "охорона"

gatekeeper:
  # DRAFT — коротко, без продажу. Секретар має почути зрозуміле питання, а не пропозицію.
  reason_for_call: "Доброго дня! Компанія Дніпрограф, друкарня з Дніпра. Підкажіть, будь ласка, з ким у вас можна поговорити щодо замовлення поліграфії?"

  target_roles:                       # [CLIENT]
    - "той, хто займається закупівлями"
    - "керівник"

  on_send_by_email: capture

  # DRAFT — запитуємо м'яко і без оцінки, інакше людина закривається.
  existing_supplier_probe: "А зараз ви де друкуєте, якщо не секрет?"

  # [CLIENT] — дослівне формулювання клієнта.
  # Не оголошується самостійно: лише коли людина питає або явно підозрює.
  identity_disclosure: "Так, ви дійсно розмовляєте з AI-помічником. Наша компанія не стоїть на місці і прагне постійно розвиватись."

qualification:
  # DRAFT — derived from the agreed call goal. Printing is quoted, not sold off
  # a price list, so these four parameters are what a quote actually requires.
  # Confirm or correct before use.
  criteria:
    - id: product_type
      question: "Що саме потрібно друкувати?"
      qualifies_if: "названо позицію з products; якщо це пакування або друк на тканині — дискваліфікація"
    - id: quantity
      question: "Який приблизно тираж?"
      qualifies_if: "названо кількість"
    - id: deadline
      question: "На коли потрібно?"
      qualifies_if: "названо термін або період"
    - id: artwork
      question: "Макет у вас готовий, чи потрібна підготовка?"
      qualifies_if: "будь-яка відповідь — обидві ведуть до прорахунку, друга ще й до послуги дизайну"

  disqualifiers:                      # [CLIENT] — outside what the company does
    - "потрібне пакування (коробки, тара)"
    - "потрібен друк на тканині"

# DRAFT (source: agent-draft) — замінити/доповнити реальними з записів розмов.
#
# ПРИНЦИП: жодна відповідь не спирається на твердження про перевагу над
# конкурентом. Ми не знаємо ні своїх строків, ні мінімальних тиражів, ні цін
# конкурента — тож агент їх не називає (див. core/conversation/state-machine.md
# §Factual discipline). Позиція скрізь одна: не витісняти чинну друкарню, а
# стати другим варіантом і отримати прорахунок для порівняння.
objections:
  - trigger: "у нас вже є друкарня / ми працюємо з іншими"
    response: "Це зрозуміло, і я не пропоную нікого міняти. Зазвичай нас беруть як другий варіант — на випадок, коли основна друкарня завантажена або горять терміни. Можна ми просто прорахуємо ваш наступний тираж, щоб вам було з чим порівняти?"
    exit: "Якщо ні — запитати, коли приблизно наступне замовлення і хто ним займається; зафіксувати як C і поставити повторний дзвінок на цей час."
    source: agent-draft

  - trigger: "надішліть інформацію на пошту"
    response: "Добре, передам менеджеру, він надішле. Щоб надіслати саме по вашій темі, а не загальний прайс — підкажіть, що ви зазвичай друкуєте?"
    exit: "Записати адресу та імʼя. Якщо специфіки не дають — C. Пообіцяне має бути надіслане менеджером, інакше це зіпсована обіцянка."
    source: agent-draft

  - trigger: "зараз нічого не потрібно"
    response: "Тоді не буду відволікати. Підкажіть тільки, коли у вас зазвичай буває потреба — щоб я подзвонив вчасно, а не навмання?"
    exit: "Записати період і контакт — це C і точка для повторного дзвінка. Не наполягати."
    source: agent-draft

  - trigger: "дорого / у нас дешевше"
    response: "Я ваших поточних умов не знаю, тому й не сперечаюся. Саме тому й пропоную прорахувати конкретний тираж — тоді буде видно, є різниця чи немає."
    exit: "Якщо відмова — C. Агент НЕ називає цін і НЕ торгується: цих даних у нього немає."
    source: agent-draft

  - trigger: "ви далеко / ми не в Дніпрі"
    response: "Ми відправляємо Новою поштою по всій Україні, тож географія тут ролі не грає."
    exit: "Якщо все одно принципово — прийняти і вийти."
    source: agent-draft         # факт про доставку — [WEB], підтверджений публічно

  - trigger: "немає часу / я зайнятий"
    response: "Тоді одне питання: коли зручніше передзвонити?"
    exit: "Записати час. Не продовжувати розмову після цієї фрази."
    source: agent-draft

  - trigger: "це робот? / ви жива людина?"
    response: "<використати gatekeeper.identity_disclosure дослівно>"
    exit: "Продовжити розмову з того місця, де перервалися. Заперечувати заборонено."
    source: client-supplied

knowledge_base:
  path: ./kb/dniprograf/
  citations_required: true

crm:
  provider: keycrm
  pipeline_id: null                   # TODO(BLOCKER)
  status_map: { A: null, B: null, C: null, D: null, X: null }
  field_map: {}                       # TODO(BLOCKER)
  write_transcript: true
  write_recording_url: true

scoring:
  confidence_floor: 0.7
  tier_weights: { A: 1.0, B: 0.5, C: 0.15 }   # reporting only; never summed

kpi:
  target_answer_rate: 0.90
  target_ab_lead_rate: 0.025
  target_c_capture_rate: null         # unmeasured — establish in pilot
  max_cost_per_lead_usd: 5.00
  max_avg_handle_time_seconds: 90

channels:
  voice: { enabled: true }
  email: { enabled: false, provider: null, templates_path: null }

handoff:
  enabled: false
  managers: []                        # TODO(BLOCKER)
  availability_source: null           # TODO(BLOCKER)
  bridge_timeout_seconds: 20
  announcement: null                  # TODO(BLOCKER)
  fallback: callback
