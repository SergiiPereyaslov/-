# Vertical: Дніпрограф
# Conforms to config/schema.json
#
# Дніпрограф is a PRINTING HOUSE (друкарня): printing services and printed
# products. Target audience is B2B — any enterprise that uses printed materials
# in its operations. `[CLIENT]`
#
# NOTE: an earlier revision of this file inferred a different business from
# seed data in this repository. That seed data belongs to a separate project
# for a different company and has no bearing on this vertical. All inferences
# drawn from it have been removed.
#
# Fields below are TODO(BLOCKER) because they are genuinely unknown. Per
# core/epistemics.md they must not be filled with plausible guesses — a printing
# house's script depends entirely on what it prints, to whom, and why a
# prospect would leave their current printer.

