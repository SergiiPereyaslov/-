  # The audience appears to be a CLOSED, FULLY ENUMERABLE market (educational
  # institutions), not an open population of companies. If so, filtering a
  # YouControl export by КВЕД + region is the wrong instrument: the correct list
  # is the register of educational institutions, and 238 of them are already
  # present in seed/institutions.json.
