<title>LeadRadar — прототип інтерфейсу</title>
<style>
:root{
  --ink:#14202C; --ink-2:#3A4C5E; --ink-3:#6B7F92;
  --paper:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --line:#DCE3E9; --line-2:#C6D1DA;
  --ember:#D9642B; --ember-soft:#F3E0D5;
  --amber:#C08A2E; --amber-soft:#F2E8D4;
  --cold:#5A7C99; --cold-soft:#E0E8EF;
  --ok:#2C8168; --ok-soft:#DCEBE5;
  --alert:#A8433A; --alert-soft:#F2DEDC;
  --shadow:0 1px 2px rgba(20,32,44,.06), 0 8px 24px -12px rgba(20,32,44,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E4EBF1; --ink-2:#A8BAC9; --ink-3:#76899A;
    --paper:#101923; --surface:#18232F; --surface-2:#1E2B39;
    --line:#2A3947; --line-2:#394B5C;
    --ember:#F0834A; --ember-soft:#33231A;
    --amber:#D8A548; --amber-soft:#2E2718;
    --cold:#7EA3C2; --cold-soft:#1C2A36;
    --ok:#4FAE8E; --ok-soft:#16291F;
    --alert:#D4685C; --alert-soft:#2E1B1A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#E4EBF1; --ink-2:#A8BAC9; --ink-3:#76899A;
  --paper:#101923; --surface:#18232F; --surface-2:#1E2B39;
  --line:#2A3947; --line-2:#394B5C;
  --ember:#F0834A; --ember-soft:#33231A;
  --amber:#D8A548; --amber-soft:#2E2718;
  --cold:#7EA3C2; --cold-soft:#1C2A36;
  --ok:#4FAE8E; --ok-soft:#16291F;
  --alert:#D4685C; --alert-soft:#2E1B1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --ink:#14202C; --ink-2:#3A4C5E; --ink-3:#6B7F92;
  --paper:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --line:#DCE3E9; --line-2:#C6D1DA;
  --ember:#D9642B; --ember-soft:#F3E0D5;
  --amber:#C08A2E; --amber-soft:#F2E8D4;
  --cold:#5A7C99; --cold-soft:#E0E8EF;
  --ok:#2C8168; --ok-soft:#DCEBE5;
  --alert:#A8433A; --alert-soft:#F2DEDC;
  --shadow:0 1px 2px rgba(20,32,44,.06), 0 8px 24px -12px rgba(20,32,44,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:640}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 20px}
.brand b{font-size:17px;letter-spacing:-.03em;font-weight:680}
.brand .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ember);border:1px solid var(--ember);
  border-radius:3px;padding:1px 4px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:6px;color:var(--ink-2);font-size:14px;text-align:left;
  transition:background .12s,color .12s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--cold-soft);color:var(--ink);font-weight:600}
.nav .count{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px}
.themebtn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:3px 0}
.themebtn:hover{color:var(--ink)}

.main{padding:26px 30px 70px;max-width:1180px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:6px}
.page-head h1{font-size:25px}
.page-sub{color:var(--ink-3);font-size:13.5px;margin:3px 0 22px;max-width:66ch}

/* ---------- campaign strip ---------- */
.strip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:11px 15px;margin-bottom:22px;box-shadow:var(--shadow)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
  box-shadow:0 0 0 0 var(--ok);animation:p 2.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(44,129,104,.5)}70%{box-shadow:0 0 0 7px rgba(44,129,104,0)}100%{box-shadow:0 0 0 0 rgba(44,129,104,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.strip .sep{width:1px;height:22px;background:var(--line)}
.strip .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);display:block}
.strip .val{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-2);border-radius:6px;padding:5px 12px;font-size:13px;
  background:var(--surface);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:560}
.btn.primary:hover{filter:brightness(1.07)}

/* ---------- cards & stats ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:15px 16px;box-shadow:var(--shadow)}
.card h3{font-size:13.5px;margin-bottom:2px}
.card .hint{font-size:12px;color:var(--ink-3);margin-bottom:13px}

.stat{text-align:left;width:100%;display:block;position:relative;
  transition:border-color .13s,transform .13s}
.stat:hover{border-color:var(--ember);transform:translateY(-1px)}
.stat:hover .drill{opacity:1}
.stat .v{font-family:var(--mono);font-size:29px;font-weight:620;
  font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1.1;margin-top:7px}
.stat .d{font-size:12px;color:var(--ink-3);margin-top:3px}
.drill{position:absolute;top:13px;right:13px;font-size:11px;color:var(--ember);
  opacity:0;transition:opacity .13s;font-family:var(--mono)}

/* ---------- funnel ---------- */
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:132px 1fr 96px;align-items:center;gap:12px;
  width:100%;text-align:left;padding:3px 5px;border-radius:5px;transition:background .12s}
.frow:hover{background:var(--surface-2)}
.frow .fl{font-size:13px}
.bar{height:20px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px}
.frow .fn{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.frow .fp{color:var(--ink-3);font-size:11.5px}

/* ---------- tier / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap;font-weight:560}
.t-A{background:var(--ember-soft);color:var(--ember);border-color:var(--ember)}
.t-B{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.t-C{background:var(--cold-soft);color:var(--cold);border-color:var(--cold)}
.t-D{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2)}
.t-X{background:var(--alert-soft);color:var(--alert);border-color:var(--alert)}
.t-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- table ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;
  padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.co{font-weight:560}
.co small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;
  font-family:var(--mono)}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.chip{border:1px solid var(--line-2);border-radius:20px;padding:3.5px 11px;font-size:12.5px;
  color:var(--ink-2);background:var(--surface);transition:.12s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.42);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(660px,100%);z-index:50;
  background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;z-index:2}
.dbody{padding:20px 22px 60px;display:flex;flex-direction:column;gap:22px}
.x{font-size:20px;line-height:1;color:var(--ink-3);padding:2px 6px;border-radius:5px}
.x:hover{background:var(--surface-2);color:var(--ink)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;font-weight:520}

.wave{width:100%;height:74px;display:block;border-radius:6px;background:var(--surface-2)}
.wkey{display:flex;gap:15px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  margin-top:7px;flex-wrap:wrap}
.wkey span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}

.turns{display:flex;flex-direction:column;gap:9px}
.turn{display:grid;grid-template-columns:52px 1fr;gap:11px;font-size:13.5px;line-height:1.5}
.turn .ts{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:3px;
  font-variant-numeric:tabular-nums}
.turn .tx{padding:7px 12px;border-radius:8px}
.turn.agent .tx{background:var(--cold-soft);border:1px solid var(--line)}
.turn.lead .tx{background:var(--surface-2);border:1px solid var(--line)}
.turn .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:2px}
.flag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--ember-soft);color:var(--ember);margin-left:6px;letter-spacing:.04em}

.why{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--ember);
  border-radius:7px;padding:12px 14px}
.why p{margin:5px 0 0;font-size:13px;color:var(--ink-2)}

/* ---------- config ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:15px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.field .help{font-size:12px;color:var(--ink-3)}
input[type=text],textarea,select{font:inherit;font-size:13.5px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;
  width:100%;resize:vertical}
textarea{min-height:64px;line-height:1.5}
.vhist{display:flex;flex-direction:column;gap:0}
.vrow{display:grid;grid-template-columns:78px 1fr auto;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.vrow:last-child{border-bottom:none}
.vrow .vn{font-family:var(--mono);font-size:12px;color:var(--ember);font-weight:600}
.vrow .vd{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

/* ---------- upload ---------- */
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:34px 20px;text-align:center;
  background:var(--surface);transition:.15s}
.drop:hover{border-color:var(--ember);background:var(--surface-2)}
.drop .big{font-size:15px;font-weight:580}
.drop .sm{font-size:12.5px;color:var(--ink-3);margin-top:4px}

.note{background:var(--ember-soft);border:1px solid var(--ember);border-radius:8px;
  padding:12px 15px;font-size:13px;color:var(--ink)}
.note b{color:var(--ember)}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legendbar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.legendbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}

@media(max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
  .brand{padding:0 12px 0 4px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail-foot{margin:0 0 0 auto;border:none;padding:0}
  .g4,.g3,.g2,.cmp{grid-template-columns:1fr}
  .main{padding:20px 16px 60px}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>LeadRadar</b><span class="tag">прототип</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <button class="themebtn" id="theme">◐ Тема</button>
      <div class="eyebrow">Дніпрограф · пілот</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Деталі"></aside>

function match(c,f){
  if(!f) return true;
  if(f==="answered") return true;
  if(f==="dm") return c.gate!==undefined && ["A","B","C"].includes(c.tier);
  if(f==="kept") return c.kept==="kept";
  if(["A","B","C","D","X"].includes(f)) return c.tier===f;
  if(REASONS[f]) return c.reason===f;
  if(EXITS[f]) return c.exit===f;
  return true;
}

function drawWave(cv,env,turns,dur){
  const dpr=devicePixelRatio||1, w=cv.clientWidth, h=74;
  cv.width=w*dpr; cv.height=h*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  const cA=cs.getPropertyValue("--cold").trim(), cL=cs.getPropertyValue("--ember").trim(),
        cG=cs.getPropertyValue("--line-2").trim();
  const n=env.length, bw=w/n, mid=h/2;
  const speaker=t=>{
    let s="g";
    for(const tr of turns){ if(t>=tr[0]) s=tr[1]==="a"?"a":"l"; }
    return s;
  };
  const lastT=turns.length?turns[turns.length-1][0]:0;
  for(let i=0;i<n;i++){
    const t=(i/n)*Math.max(dur,lastT+4);
    const v=env[i], hh=Math.max(1.2, v*(h*0.42));
    const s=v<0.02?"g":speaker(t);
    x.fillStyle=s==="a"?cA:s==="l"?cL:cG;
    x.globalAlpha=v<0.02?0.55:0.9;
    x.fillRect(i*bw, mid-hh, Math.max(bw-0.6,0.7), hh*2);
  }
  x.globalAlpha=1;
  x.strokeStyle=cG; x.lineWidth=1;
  x.beginPath(); x.moveTo(0,mid+.5); x.lineTo(w,mid+.5); x.stroke();
}

  const cur=root.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  root.setAttribute("data-theme", cur==="dark"?"light":"dark");
  const cv=document.querySelector("#wv");
  if(cv) render();
};
addEventListener("resize",()=>{const cv=document.querySelector("#wv"); if(cv) closeDrawer();});

render();
</script>
