# Обмеження для служби PHP-FPM на рівні systemd.
#
# Покласти в /etc/systemd/system/php8.4-fpm.service.d/hardening.conf
# (каталог створити), потім:
#   systemctl daemon-reload && systemctl restart php8.4-fpm
#
# Це третій рубіж після прав доступу й open_basedir. Кожен закриває
# свій випадок: права — «хто може», open_basedir — «куди дивиться PHP»,
# ці налаштування — «що взагалі бачить процес з ядра». Перевірити
# результат: systemd-analyze security php8.4-fpm

[Service]
# Уся файлова система, крім /home, /root і /run/user, — тільки читання
ProtectSystem=strict
ProtectHome=true

# Винятки: каталоги, у які служба справді має писати
ReadWritePaths=/var/www/smartecopack/storage
ReadWritePaths=/var/www/smartecopack/bootstrap/cache
ReadWritePaths=/var/log/php-fpm
ReadWritePaths=/run/php

# Власний /tmp, невидимий для інших служб. Завантажений через форму
# файл більше не лежить у спільному каталозі, де його може прочитати
# будь-який інший процес на машині.
PrivateTmp=true

# Процес не може підвищити свої права, навіть запустивши setuid-файл
NoNewPrivileges=true

# Пристрої: сайту не потрібен доступ ні до дисків, ні до чогось іще
PrivateDevices=true

# Ядро: ні модулів, ні зміни sysctl, ні читання журналу ядра
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectKernelLogs=true
ProtectControlGroups=true

# Тільки звичайні сокети: без AF_PACKET процес не зможе слухати
# сирий трафік мережі
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Створення виконуваних ділянок пам'яті — типовий крок експлойта
MemoryDenyWriteExecute=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true

# Системні виклики: лише те, що потрібно звичайній службі
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Зауваження: MemoryDenyWriteExecute несумісний із JIT в OPcache. У
# PHP 8.4 JIT вимкнений за замовчуванням, і для цього сайту він не
# потрібен — вузьке місце тут база, не процесор. Якщо колись
# вмикатимете opcache.jit — цей рядок доведеться прибрати.
