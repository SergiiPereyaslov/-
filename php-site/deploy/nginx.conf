# nginx перед PHP-FPM: HTTPS, статика, стиснення, обмеження частоти.
#
# Покласти в /etc/nginx/sites-available/smartecopack і зробити symlink
# у sites-enabled. Сертифікат — certbot --nginx -d smartecopack.com.ua
#                                        -d www.smartecopack.com.ua
#
# Відмінність від вузлової версії: тут немає застосунку, який слухає
# порт. nginx сам віддає файли з public/ і передає решту в PHP-FPM
# через unix-сокет. Через це статика взагалі не доходить до PHP, а
# сокет недосяжний ззовні — на нього не можна постукати з мережі.

# Версію nginx стороннім знати нема потреби
server_tokens off;

# HTTP/2 вмикається прапорцем у listen, а не окремою директивою
# http2 on: остання з'явилась лише в nginx 1.25, а Ubuntu 24.04
# постачає 1.24 — з нею конфіг просто не завантажиться. Перевірено:
# nginx -t на 1.24 падає з «unknown directive "http2"».

# ── Обмеження частоти запитів ────────────────────────────────────────
#
# Зони оголошені в контексті http (цей файл підключається саме туди).
# 10m пам'яті ≈ 160 тис. IP — з запасом.
#
# Вхід в адмінку: застосунок і сам блокує акаунт після 10 невдалих
# спроб, але це другий рубіж — він зупиняє перебір ще до bcrypt, не
# даючи навантажити процесор. 60 запитів/хв вистачає для звичайної
# роботи в панелі, де кожна сторінка — кілька запитів.
limit_req_zone $binary_remote_addr zone=sep_admin:10m rate=60r/m;

# Заявки: справжня людина надсилає форму раз на кілька хвилин.
limit_req_zone $binary_remote_addr zone=sep_lead:10m rate=10r/m;

# Пошук і лічильник A/B: пошук ходить на кожне натискання з дебаунсом
# 200 мс, тому ліміт має бути помітно вищим, інакше постраждає підказка.
limit_req_zone $binary_remote_addr zone=sep_api:10m rate=120r/m;

# 429 замість 503: чесний код для «забагато запитів»
limit_req_status 429;

# Увесь трафік на канонічний хост по HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartecopack.com.ua www.smartecopack.com.ua;
    return 301 https://smartecopack.com.ua$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.smartecopack.com.ua;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com.ua/privkey.pem;

    # www — окремий хост, а не дубль: без цього редиректу пошуковик
    # бачив би дві копії сайту
    return 301 https://smartecopack.com.ua$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartecopack.com.ua;

    # Корінь — саме public/, а не каталог проєкту. Це принципово:
    # рівнем вище лежать .env із паролем до бази, storage/ з логами й
    # vendor/ з усім стороннім кодом. Якщо вказати сюди корінь
    # проєкту, .env стане доступним за прямим посиланням.
    root /var/www/smartecopack/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/smartecopack.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartecopack.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ці заголовки ставить і сам застосунок. Дубль навмисний: якщо
    # колись поруч з'явиться інший спосіб дістатись до сайту, захист
    # поїде разом із застосунком, а не лишиться в цьому файлі.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    charset utf-8;

    # Імпорт каталогу в адмінці обмежений 5 МБ; 8 — із запасом на
    # накладні витрати multipart
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml image/svg+xml;

    # ── Статика ──────────────────────────────────────────────────────

    # Зібрані Vite ресурси мають хеш у імені: зміна вмісту змінює ім'я,
    # тож кешувати їх можна назавжди
    location ^~ /build/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── Динаміка ─────────────────────────────────────────────────────

    # Приймання заявок — найдорожчий публічний ендпоінт: пише в БД і
    # смикає Telegram та SMTP. Без ліміту ним можна засипати менеджера
    # й підставити поштовий домен під блоклист.
    location = /api/lead {
        limit_req zone=sep_lead burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Решта публічного API: пошук і лічильник тесту
    location /api/ {
        limit_req zone=sep_api burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Адмінка: тільки обмеження частоти.
    #
    # Заборону кешування й індексації (Cache-Control: no-store,
    # X-Robots-Tag) ставить застосунок. Тут їх немає навмисно: add_header
    # у цій локації не спрацював би взагалі — try_files робить внутрішній
    # редирект у location ~ \.php$, і заголовки додає вже вона. Перевірено
    # curl'ом на живому стенді: заголовків у відповіді не було.
    # limit_req, на відміну від них, переживає внутрішній редирект —
    # теж перевірено: 31 запит проходить, далі йдуть 429.
    location /admin/ {
        limit_req zone=sep_admin burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Завершальний слеш у $uri зберігається: застосунок сам вирішує,
    # куди робити 301, і робить це одним переходом
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/smartecopack.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Приховані файли: .env, .git, .htaccess. У public/ їх бути не
    # повинно, але правило страхує від випадкового копіювання каталогу
    # проєкту цілком. Виняток — /.well-known/, через який віддається
    # security.txt і працює перевірка домену в certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Файли, яких у public/ бути не повинно взагалі
    location ~* \.(env|sql|sqlite|log|bak|ini|yml|yaml|lock)$ {
        deny all;
    }
}
