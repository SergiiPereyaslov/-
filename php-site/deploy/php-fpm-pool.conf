; Пул PHP-FPM для SmartEcoPack.
;
; Покласти в /etc/php/8.4/fpm/pool.d/smartecopack.conf і прибрати
; стандартний www.conf (або хоча б перейменувати його в www.conf.disabled),
; інакше два пули слухатимуть різні сокети й ви правитимете не той.
;
; Після правок: systemctl reload php8.4-fpm

[smartecopack]

; Окремий системний користувач, не www-data і точно не root. Сенс —
; у тому, що станеться після компрометації: код, який виконується від
; цього користувача, не має доступу ні до чужих сайтів на цій машині,
; ні до записів у власний каталог із кодом (див. права в INSTALL.md).
user = smartecopack
group = smartecopack

; Unix-сокет, а не TCP: до нього неможливо достукатись із мережі,
; навіть якщо хтось помилиться з правилами фаєрвола
listen = /run/php/smartecopack.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── Процеси ──────────────────────────────────────────────────────────
;
; dynamic: тримати кілька процесів напоготові, піднімати решту під
; навантаженням. Числа розраховані на 2 ГБ пам'яті й ~60 МБ на процес.
; На більшій машині множити pm.max_children пропорційно пам'яті, а не
; ядрам: PHP тут упирається в пам'ять, не в процесор.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Перезапуск процесу після 500 запитів. Страховка від витоків пам'яті
; у сторонніх бібліотеках: процес не встигає розпухнути.
pm.max_requests = 500

; Сторінка стану — тільки з петлі, через окремий location у nginx.
; Закоментовано навмисно: відкритий /fpm-status видає назовні шляхи,
; кількість процесів і поточні запити.
; pm.status_path = /fpm-status

; ── Ліміти запиту ────────────────────────────────────────────────────

; Довші за це запити вбиваються з записом у лог. Найдовше тут —
; надсилання заявки (SMTP + Telegram), і воно вкладається в секунди.
request_terminate_timeout = 60s

php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_execution_time] = 60

; ── Безпека ──────────────────────────────────────────────────────────

; Версія PHP у заголовку відповіді потрібна тільки тому, хто шукає
; хости зі старою версією під відому вразливість. Застосунок прибирає
; її й сам (header_remove), але тут вона не додається взагалі.
php_admin_value[expose_php] = Off

; Помилки — у лог, а не на екран. Показана відвідувачу помилка PHP
; містить повний шлях до файлу, а часто й фрагмент запиту до бази.
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /var/log/php-fpm/smartecopack-error.log

; PHP не може вийти за межі каталогу проєкту й системних тимчасових
; файлів. Це не заміна правам доступу, а другий рубіж: навіть якщо в
; коді знайдеться читання файлу за адресою від відвідувача,
; /etc/passwd він уже не прочитає.
php_admin_value[open_basedir] = /var/www/smartecopack:/tmp:/usr/share/php

; Функції, потрібні лише для запуску зовнішніх команд. Сайту вони не
; потрібні жодного разу; вимкнення робить безкорисними більшість
; готових веб-шелів.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; ── Кеш коду ─────────────────────────────────────────────────────────
;
; На проді файли не змінюються між розгортаннями, тож перевіряти час
; правки на кожному запиті нема сенсу. Після викладення нової версії
; обов'язково systemctl reload php8.4-fpm — інакше сайт працюватиме
; на старому коді.
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
